# Phase 7 supplies the CMS rewrite rules.
server {
    listen 80;
    root /var/www/html;
    index index.php;

    location / {
        try_files $uri $uri/ @cms;
    }

    location ~ /\.(?!well-known(?:/|$)) {
        deny all;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location @cms {
        rewrite ^/(.*)\.html$ /index.php?tid=$1? last;
        rewrite ^/gallery/(.*)$ /index.php?id=$1? last;
        rewrite ^/media(.*)$ /index.php?downloadfile=tid&tid=$1? last;
        return 404;
    }
}
